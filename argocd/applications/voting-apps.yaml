apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-voting-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/my-org/student-voting.git'
    targetRevision: HEAD
    path: k8s/overlays/eks
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: voting
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
