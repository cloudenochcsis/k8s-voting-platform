# Cluster add-ons the overlays depend on, delivered the same way as the app (GitOps). AKS gets its
# equivalents (AGIC, Key Vault CSI) as managed addons from Terraform; GKE Ingress is built in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-eks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2
    helm:
      releaseName: external-secrets  # SA is named after the release; terraform binds external-secrets/external-secrets
      valuesObject:
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/voting-prod-eks-external-secrets-role
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.13.0
    helm:
      valuesObject:
        clusterName: voting-prod-eks
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/voting-prod-eks-alb-controller-role
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-gke
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2
    helm:
      releaseName: external-secrets  # SA is named after the release; terraform binds external-secrets/external-secrets
      valuesObject:
        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: voting-external-secrets@my-voting-gcp-project.iam.gserviceaccount.com
  destination:
    server: https://gke-cluster.internal
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
