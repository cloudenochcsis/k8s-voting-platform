version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voting-postgres
    environment:
      POSTGRES_DB: voting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voting_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voting-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  eligibility-api:
    build:
      context: ./services/eligibility-api
    container_name: voting-eligibility-api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/voting_db
      JWT_SECRET: voting-super-secret-jwt-key
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  vote-api:
    build:
      context: ./services/vote-api
    container_name: voting-vote-api
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: voting-super-secret-jwt-key
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
    container_name: voting-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/voting_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  results-api:
    build:
      context: ./services/results-api
    container_name: voting-results-api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/voting_db
      ADMIN_SECRET: admin-secret-reveal-key
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
    container_name: voting-frontend
    ports:
      - "8080:80"
    depends_on:
      - eligibility-api
      - vote-api
      - results-api

volumes:
  pgdata:
