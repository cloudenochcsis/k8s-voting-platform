x-db-url: &db_url postgresql://postgres:postgrespassword@postgres:5432/voting_db
x-jwt: &jwt_secret local-dev-only-jwt-secret

services:
  postgres:
    image: postgres:16-alpine
    container_name: voting-postgres
    environment:
      POSTGRES_DB: voting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./k8s/base/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voting_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voting-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  eligibility-api:
    build: ./services/eligibility-api
    container_name: voting-eligibility-api
    environment:
      DATABASE_URL: *db_url
      JWT_SECRET: *jwt_secret
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  vote-api:
    build: ./services/vote-api
    container_name: voting-vote-api
    environment:
      REDIS_HOST: redis
      JWT_SECRET: *jwt_secret
      CANDIDATES: "Slate 1: Green Campus Coalition|Slate 2: Tech & Innovation League|Slate 3: Student Voice & Welfare|Slate 4: Arts & Culture Alliance"
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./services/worker
    container_name: voting-worker
    environment:
      DATABASE_URL: *db_url
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  results-api:
    build: ./services/results-api
    container_name: voting-results-api
    environment:
      DATABASE_URL: *db_url
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    container_name: voting-frontend
    ports:
      - "8080:8080"
    depends_on:
      - eligibility-api
      - vote-api
      - results-api

  # One-shot: `docker compose run --rm reveal-gate` (mirrors the Kubernetes CronJob)
  reveal-gate:
    build: ./services/reveal-gate
    profiles: ["tools"]
    environment:
      DATABASE_URL: *db_url
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
