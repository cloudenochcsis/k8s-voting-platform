version: 2.1

# Required project env vars for build-and-push: GHCR_USER, GHCR_TOKEN (PAT with write:packages).
# Image tag bumps in k8s/overlays/*/kustomization.yaml are a follow-up (ArgoCD Image Updater or a
# `kustomize edit set image` commit step with a write deploy key).

jobs:
  test:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Start the stack
          command: docker compose up -d --build --wait
      - run:
          name: Integration test (real services, concurrent duplicate votes)
          command: |
            pip install psycopg2-binary redis
            python3 test_e2e.py
      - run:
          name: Service logs on failure
          command: docker compose logs --tail 50
          when: on_fail

  build-and-push:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build and push all service images
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            REGISTRY=ghcr.io/cloudenochcsis/student-voting
            for SVC in eligibility-api vote-api worker results-api reveal-gate frontend; do
              docker build -t "$REGISTRY/$SVC:$CIRCLE_SHA1" "services/$SVC"
              docker push "$REGISTRY/$SVC:$CIRCLE_SHA1"
            done

workflows:
  build-test-deliver:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
          filters:
            branches:
              only: main
