apiVersion: v1
kind: Secret
metadata:
  name: voting-secrets
  namespace: voting
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/voting_db"
  POSTGRES_PASSWORD: "postgrespassword"
  JWT_SECRET: "voting-production-jwt-signing-key-placeholder"
  ADMIN_SECRET: "admin-production-reveal-secret-placeholder"
