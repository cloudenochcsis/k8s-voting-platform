apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voting

resources:
  - rbac.yaml
  - configmap.yaml
  - deployments/redis.yaml
  - deployments/eligibility-api.yaml
  - deployments/vote-api.yaml
  - deployments/worker.yaml
  - deployments/results-api.yaml
  - deployments/frontend.yaml
  - statefulsets/postgres.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policies.yaml
  - cronjob-reveal.yaml
# NOTE: no Secret here. Each overlay materialises `voting-secrets` from its cloud's secret store
# (ExternalSecret on EKS/GKE, Key Vault CSI on AKS). For kind/local: kubectl create secret generic voting-secrets ...

# Schema lives in one file, shared with docker-compose.
configMapGenerator:
  - name: postgres-init-config
    files:
      - init.sql

# Every workload runs non-root with no capabilities; images already declare a non-root USER.
# Pod-level map: strategic merge (keeps postgres/redis runAsUser/fsGroup). Container-level block:
# JSON patch on containers/0, because strategic merge keys containers by name and would APPEND a
# stray container instead of merging. Every pod here has exactly one container.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-important
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  - target:
      kind: StatefulSet
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: not-important
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: not-important
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
