# 1. Default deny all ingress traffic in the voting namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: voting
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# 2. Allow DNS egress for all pods in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: voting
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# 3. Allow traffic to frontend from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
---
# 4. Allow traffic to eligibility-api from ingress controller, allow egress to postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eligibility-api
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eligibility-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8001
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
---
# 5. Allow traffic to vote-api from ingress controller, allow egress to redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vote-api
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vote-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8002
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
---
# 6. Worker network policy: egress to Redis and Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
---
# 7. Allow traffic to results-api from ingress, allow egress to postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-results-api
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: results-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8003
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
---
# 8. Redis ingress policy: only vote-api and worker can connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vote-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: worker
    ports:
    - protocol: TCP
      port: 6379
---
# 9. Postgres ingress policy: eligibility-api, worker, results-api, and reveal-gate can connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: voting
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: eligibility-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: worker
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: results-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: reveal-gate
    ports:
    - protocol: TCP
      port: 5432
