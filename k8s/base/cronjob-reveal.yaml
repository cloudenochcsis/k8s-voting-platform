apiVersion: batch/v1
kind: CronJob
metadata:
  name: reveal-gate
  namespace: voting
  labels:
    app.kubernetes.io/name: reveal-gate
spec:
  # Poll-closing time. The flag is one-way, so this ships SUSPENDED: a daily schedule on a cluster that
  # exists before election day would reveal results the evening before the poll opens.
  # On election day:  kubectl -n voting patch cronjob reveal-gate -p '{"spec":{"suspend":false}}'
  # Or fire it now:   kubectl -n voting create job reveal-now --from=cronjob/reveal-gate
  schedule: "0 20 * * *"
  timeZone: "Etc/UTC"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reveal-gate
        spec:
          serviceAccountName: sa-reveal-gate
          restartPolicy: OnFailure
          containers:
          - name: reveal-gate
            image: student-voting/reveal-gate:v1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voting-secrets
                  key: DATABASE_URL
