apiVersion: batch/v1
kind: CronJob
metadata:
  name: reveal-gate
  namespace: voting
  labels:
    app.kubernetes.io/name: reveal-gate
spec:
  schedule: "0 20 * * *" # Runs at 20:00 UTC (election poll closing time)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reveal-gate
        spec:
          serviceAccountName: sa-reveal-gate
          restartPolicy: OnFailure
          containers:
          - name: reveal-gate
            image: student-voting/reveal-gate:v1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voting-secrets
                  key: DATABASE_URL
