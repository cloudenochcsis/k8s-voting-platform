apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-api
  namespace: voting
  labels:
    app.kubernetes.io/name: results-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: results-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: results-api
    spec:
      serviceAccountName: sa-results
      containers:
      - name: results-api
        image: student-voting/results-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voting-secrets
              key: DATABASE_URL
        - name: ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: voting-secrets
              key: ADMIN_SECRET
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8003
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: results-api
  namespace: voting
  labels:
    app.kubernetes.io/name: results-api
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  selector:
    app.kubernetes.io/name: results-api
