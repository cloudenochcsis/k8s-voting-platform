apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-api
  namespace: voting
  labels:
    app.kubernetes.io/name: vote-api
spec:
  # replicas intentionally unset: managed by vote-api-hpa (a fixed value here is reverted by ArgoCD selfHeal)
  selector:
    matchLabels:
      app.kubernetes.io/name: vote-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vote-api
    spec:
      serviceAccountName: sa-vote
      containers:
      - name: vote-api
        image: student-voting/vote-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_PORT
        - name: REDIS_STREAM
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_STREAM
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voting-secrets
              key: JWT_SECRET
        - name: CANDIDATES
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: CANDIDATES
        resources:
          requests:
            cpu: "150m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vote-api
  namespace: voting
  labels:
    app.kubernetes.io/name: vote-api
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  selector:
    app.kubernetes.io/name: vote-api
