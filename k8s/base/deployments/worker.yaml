apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: sa-worker
      containers:
      - name: worker
        image: student-voting/worker:v1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voting-secrets
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_PORT
        - name: REDIS_STREAM
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_STREAM
        - name: REDIS_GROUP
          valueFrom:
            configMapKeyRef:
              name: voting-config
              key: REDIS_GROUP
        resources:
          requests:
            cpu: "150m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
