apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: voting
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS voter_roll (
        student_id VARCHAR(64) PRIMARY KEY,
        has_voted BOOLEAN DEFAULT FALSE,
        voted_at TIMESTAMP NULL
    );

    CREATE TABLE IF NOT EXISTS ballots (
        id SERIAL PRIMARY KEY,
        candidate_choice VARCHAR(128) NOT NULL,
        cast_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS election_state (
        id INT PRIMARY KEY DEFAULT 1,
        revealed BOOLEAN DEFAULT FALSE,
        revealed_at TIMESTAMP NULL,
        CONSTRAINT single_row CHECK (id = 1)
    );

    INSERT INTO election_state (id, revealed) VALUES (1, FALSE) ON CONFLICT (id) DO NOTHING;

    INSERT INTO voter_roll (student_id, has_voted)
    SELECT 'STU' || LPAD(i::text, 5, '0'), FALSE
    FROM generate_series(1, 10000) AS i
    ON CONFLICT (student_id) DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: voting
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: voting
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "voting_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voting-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "voting_db"]
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "voting_db"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
