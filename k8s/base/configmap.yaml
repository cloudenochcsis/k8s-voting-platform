apiVersion: v1
kind: ConfigMap
metadata:
  name: voting-config
  namespace: voting
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_STREAM: "vote_stream"
  REDIS_GROUP: "vote_workers"
  JWT_EXP_SECONDS: "900"
  # Pipe-separated allowlist enforced by vote-api. Must match the slates in services/frontend/index.html.
  CANDIDATES: "Slate 1: Green Campus Coalition|Slate 2: Tech & Innovation League|Slate 3: Student Voice & Welfare|Slate 4: Arts & Culture Alliance"
