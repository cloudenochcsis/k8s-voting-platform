# External Secrets Operator syncs GCP Secret Manager into `voting-secrets`. Auth is the operator's
# Workload Identity binding (terraform/modules/gke creates voting-external-secrets@<project>).
# Seed once:  printf '{"DATABASE_URL":"...","POSTGRES_PASSWORD":"...","JWT_SECRET":"..."}' \
#   | gcloud secrets create voting-app --data-file=-
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: my-gcp-project
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voting-secrets
  namespace: voting
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: voting-secrets
  dataFrom:
    - extract:
        key: voting-app
