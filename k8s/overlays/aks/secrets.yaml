# Azure Key Vault CSI driver (AKS addon enabled in terraform/modules/aks) syncs Key Vault secrets into
# `voting-secrets`. Unlike ESO, the driver only creates the Secret while some pod mounts the CSI volume,
# hence patches/postgres-csi-patch.yaml. userAssignedIdentityID is the addon identity's client id
# (terraform output `key_vault_identity_client_id`).
# Seed once:  az keyvault secret set --vault-name voting-prod-aks-kv --name DATABASE-URL --value '...'   (and POSTGRES-PASSWORD, JWT-SECRET)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: voting-secrets
  namespace: voting
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "00000000-0000-0000-0000-000000000000"
    keyvaultName: voting-prod-aks-kv
    tenantId: "00000000-0000-0000-0000-000000000000"
    objects: |
      array:
        - |
          objectName: DATABASE-URL
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: JWT-SECRET
          objectType: secret
  secretObjects:
    - secretName: voting-secrets
      type: Opaque
      data:
        - objectName: DATABASE-URL
          key: DATABASE_URL
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: JWT-SECRET
          key: JWT_SECRET
