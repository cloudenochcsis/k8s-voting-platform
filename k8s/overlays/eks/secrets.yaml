# External Secrets Operator (installed by argocd/applications/platform.yaml) syncs AWS Secrets Manager
# into the `voting-secrets` Secret the base manifests reference. Auth is the operator's IRSA role.
# Seed once:  aws secretsmanager create-secret --name voting/app --secret-string \
#   '{"DATABASE_URL":"postgresql://postgres:<pw>@postgres:5432/voting_db","POSTGRES_PASSWORD":"<pw>","JWT_SECRET":"<random>"}'
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voting-secrets
  namespace: voting
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: voting-secrets
  dataFrom:
    - extract:
        key: voting/app
