# EKS ships only the legacy `gp2` class; gp3 needs the EBS CSI addon (terraform/modules/eks) plus this class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
